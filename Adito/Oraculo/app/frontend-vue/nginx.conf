server {
    listen 80;
    server_name localhost;

    # ── SPA entry point — nunca cacheado pelo browser ─────────────────────────
    # Garante que após reiniciar o computador o browser sempre busca o index.html
    # atualizado, evitando o erro de tela em abas que ficaram em cache.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # ── Rotas da SPA ──────────────────────────────────────────────────────────
    # O Ingress do Kubernetes roteia /api e /health diretamente para o backend.
    # O nginx do frontend só precisa servir os arquivos estáticos e o index.html.
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # ── Assets estáticos com hash no nome (JS, CSS, fontes) ───────────────────
    # Esses arquivos têm hash no nome (ex: main.abc123.js), então podem ser
    # cacheados de forma agressiva sem risco de servir versão antiga.
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|ico|webp|jpg|jpeg|gif)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}