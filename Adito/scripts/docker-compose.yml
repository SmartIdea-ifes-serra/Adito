services:
  oraculo-postgres:
    image: postgres:15-alpine
    container_name: oraculo_postgres_unificado
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oraculo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oraculo_password}
      POSTGRES_DB: ${POSTGRES_DB:-oraculo_db}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - oraculo_postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oraculo} -d ${POSTGRES_DB:-oraculo_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  oraculo_postgres_data:
