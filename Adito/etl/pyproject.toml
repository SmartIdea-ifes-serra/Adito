[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adito-etl"
version = "0.1.0"
description = "ETL do Adito: extração do bruto (SRC, SigPesq, CNPq/DGP, Lattes) e cruzamento por nome normalizado"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.40",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pydantic>=2.6",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# Download do SigPesq (US-ETL-03). A conversão XLSX -> JSON não precisa dele.
sigpesq = ["agent-sigpesq @ git+https://github.com/ifesserra-lab/sigpesq_agent.git@v0.3.2"]
# Espelho DGP/CNPq (US-ETL-04) e currículos Lattes (US-ETL-05); mesmas versões do horizon_etl.
cnpq = ["dgp-cnpq-lib @ git+https://github.com/ifesserra-lab/dgp.cnqp_lib.git@v0.5.0"]
lattes = ["scriptLattes @ git+https://github.com/ifesserra-lab/scriptLattes.git@v0.8.0"]
# Credenciais no Infisical (ADITO_CREDENCIAIS=infisical); mesma versão do horizon_etl.
infisical = ["infisicalsdk==1.0.17"]
dev = ["pytest>=8.0"]

[project.scripts]
adito-etl = "adito_etl.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/adito_etl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
