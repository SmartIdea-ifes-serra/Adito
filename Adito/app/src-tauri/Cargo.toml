[package]
name = "oraculo-esx"
version = "0.1.0"
description = "Oráculo ESX desktop"
edition = "2021"

[lib]
name = "oraculo_esx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
# Cofre do SO para a chave da Mistral: Secret Service (Linux) e Credential Manager (Windows).
keyring = "4"
