name: Publicar guia do Adito

on:
  push:
    branches:
      - feature/guia-adito
    paths:
      - 'guia/**'
      - '.github/workflows/publicar-guia.yml'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: guia/
      - name: Publicar no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
